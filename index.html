<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%DOCUMENT_TITLE%</title>
    <link rel="preconnect" href="%DOCUMENT_FONTS_ORIGIN%" />
    <link rel="preconnect" href="%DOCUMENT_FONTS_STATIC_ORIGIN%" crossorigin />
    <link href="%DOCUMENT_FONT_STYLESHEET%" rel="stylesheet" />
    <script>
      (function () {
        const settings = "%DOCUMENT_THEME%";
        const theme = localStorage.getItem(settings.storageKey) || settings.light;
        if (theme === settings.light) {
          document.documentElement.classList.add(settings.light);
          document.documentElement.classList.remove(settings.dark);
        } else {
          document.documentElement.classList.add(settings.dark);
          document.documentElement.classList.remove(settings.light);
        }
      })();
    </script>
    <style>
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #1f1f1f;
        z-index: 99999;
        transition:
          opacity 0.4s ease,
          visibility 0.4s ease;
      }

      html.light #app-loading {
        background-color: #f8f9fa;
      }

      #app-loading.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .loader-circle {
        position: relative;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, #3b82f6, #a855f7, #ec4899, #3b82f6);
        animation: loading-spin 1s linear infinite;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 24px rgba(168, 85, 247, 0.35);
      }

      .loader-circle::after {
        content: "";
        position: absolute;
        width: 44px;
        height: 44px;
        background-color: #1f1f1f;
        border-radius: 50%;
        transition: background-color 0.3s;
      }

      html.light .loader-circle::after {
        background-color: #f8f9fa;
      }

      @keyframes loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="app-loading">
      <div class="loader-circle"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
