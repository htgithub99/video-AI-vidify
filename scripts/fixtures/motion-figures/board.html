<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#111;overflow:hidden}#motion-canvas{display:block;width:100vw;height:100vh}</style></head>
<body><canvas id="motion-canvas"></canvas>
<script>
const canvas = document.getElementById('motion-canvas');
const ctx = canvas.getContext('2d');
const INK = '#26201c';
const FIG = window.MotionFigures.use({
  chart(c, o) { const n = o.values.length, max = Math.max(...o.values), bw = o.w / (n * 1.6); o.values.forEach((v, i) => { const h = (v / max) * o.h * 0.85 * (o.grow ?? 1); c.fillStyle = (o.colors || [])[i] || '#b3362e'; c.fillRect(o.x + i * bw * 1.6 + bw * 0.3, o.y + o.h - h, bw, h); c.strokeStyle = INK; c.strokeRect(o.x + i * bw * 1.6 + bw * 0.3, o.y + o.h - h, bw, h); }); c.strokeRect(o.x, o.y, o.w, o.h); return {}; },
  meter(c, o) { c.strokeStyle = INK; c.lineWidth = 3; c.strokeRect(o.x, o.y, o.w, o.h); c.fillStyle = o.color || '#4b7a45'; c.fillRect(o.x + 3, o.y + 3, (o.w - 6) * o.value, o.h - 6); return {}; },
  timeline(c, o) { c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.moveTo(o.x, o.y + 20); c.lineTo(o.x + o.w * (o.progress ?? 1), o.y + 20); c.stroke(); c.fillStyle = INK; c.font = '700 18px sans-serif'; o.items.forEach((it, i) => c.fillText(String(it.year), o.x + (i / Math.max(1, o.items.length - 1)) * o.w - 20, o.y + 50)); return {}; },
  icon(c, o) { c.fillStyle = o.color || '#b3362e'; c.beginPath(); c.arc(o.x, o.y, o.r, 0, Math.PI * 2); c.fill(); c.strokeStyle = INK; c.stroke(); return {}; },
  arrow(c, o) { c.strokeStyle = o.color || '#8c1d1d'; c.lineWidth = o.width || 6; c.beginPath(); c.moveTo(o.from[0], o.from[1]); c.lineTo(o.from[0] + (o.to[0] - o.from[0]) * (o.grow ?? 1), o.from[1] + (o.to[1] - o.from[1]) * (o.grow ?? 1)); c.stroke(); return {}; },
  label(c, o) { c.fillStyle = o.color || INK; c.font = '700 ' + (o.size || 24) + 'px sans-serif'; c.fillText(o.text, o.x, o.y); return {}; },
});
window.motionScene = {
  ready: Promise.resolve(),
  renderAt: async function (input = {}) {
    const width = Math.max(320, Number(input.width) || 1280), height = Math.max(180, Number(input.height) || 720);
    if (canvas.width !== width || canvas.height !== height) { canvas.width = width; canvas.height = height; }
    const p = Math.max(0, Math.min(1, Number(input.progress) || 0));
    ctx.setTransform(width / 1280, 0, 0, height / 720, 0, 0);
    ctx.fillStyle = '#efe3c4'; ctx.fillRect(0, 0, 1280, 720);
    FIG.chart(ctx, { kind: 'bar', x: 80, y: 80, w: 460, h: 300, values: [30, 55, 80], labels: ['1239', '1240', '1241'], colors: ['#2f5d9b', '#4b7a45', '#b3362e'], grow: Math.min(1, p * 2), mark: 'chart' });
    FIG.meter(ctx, { kind: 'bar', x: 80, y: 440, w: 460, h: 40, value: 0.7, color: '#b3362e', label: 'Losses', mark: 'meter' });
    FIG.timeline(ctx, { x: 80, y: 560, w: 460, h: 60, items: [{ year: 1235, label: 'A' }, { year: 1241, label: 'B' }], progress: p, mark: 'timeline' });
    FIG.icon(ctx, { kind: 'swords', x: 900, y: 300, r: 30, color: '#b3362e', mark: 'battle' });
    FIG.icon(ctx, { kind: 'pin', x: 700, y: 520, r: 22, color: '#2f5d9b', mark: 'pest' });
    FIG.arrow(ctx, { from: [700, 520], to: [880, 320], width: 8, color: '#8c1d1d', grow: p, mark: 'route' });
    FIG.label(ctx, { x: 720, y: 560, text: 'Pest', size: 26, mark: 'label' });
  },
};
</script></body></html>
